version: '3.8'

services:
  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://root:example@mongo:27017/railmind?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
    env_file:
      - backend/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - railmind_logs:/var/log/railmind

  arq_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "backend.worker.WorkerSettings"]
    environment:
      - MONGODB_URI=mongodb://root:example@mongo:27017/railmind?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
    env_file:
      - backend/.env
    depends_on:
      - mongo
      - redis
      - fastapi

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mongo_data:
  railmind_logs:
