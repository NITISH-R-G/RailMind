version: '3.8'

services:
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railmind-api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://admin:secret@mongodb:27017/railmind?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      # Add other environment variables here or via env_file
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - railmind-network
    restart: unless-stopped

  arq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railmind-worker
    command: ["arq", "worker.WorkerSettings"]
    environment:
      - MONGODB_URI=mongodb://admin:secret@mongodb:27017/railmind?authSource=admin
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - railmind-network
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: railmind-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongodb_data:/data/db
    networks:
      - railmind-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: railmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - railmind-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: railmind-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - railmind-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: railmind-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - railmind-network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  railmind-network:
    driver: bridge
