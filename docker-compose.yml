version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railmind_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://root:example@mongodb:27017/railmind?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      # Add other environment variables as needed from .env
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    volumes:
      - backend_logs:/var/log/railmind

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railmind_worker
    command: ["arq", "backend.worker.WorkerSettings"]
    environment:
      - MONGODB_URI=mongodb://root:example@mongodb:27017/railmind?authSource=admin
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    volumes:
      - backend_logs:/var/log/railmind

  mongodb:
    image: mongo:6.0
    container_name: railmind_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=railmind
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: railmind_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: railmind_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: railmind_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
  backend_logs:
