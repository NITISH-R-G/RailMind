version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - OLLAMA_FALLBACK_URL=http://ollama:11434/api/generate
    env_file:
      - backend/.env
    depends_on:
      - mongodb
      - redis
    volumes:
      - api_logs:/app/logs
    networks:
      - railmind_network

  mongodb:
    image: mongo:8.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-default_secure_password_replace_me}
      - MONGO_INITDB_DATABASE=railmind
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - railmind_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - railmind_network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - railmind_network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - railmind_network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - railmind_network

networks:
  railmind_network:
    driver: bridge

volumes:
  mongodb_data:
  ollama_data:
  api_logs:
